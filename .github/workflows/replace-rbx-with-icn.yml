name: Replace RBX with ICN

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/replace-rbx-with-icn.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replace airport code
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('flight-information/index.html')
          text = path.read_text(encoding='utf-8')
          updated = text.replace('RBX', 'ICN')
          if updated == text:
              print('No RBX values found.')
          else:
              path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flight-information/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Replace RBX timetable code with ICN"
            git push origin main
          fi
