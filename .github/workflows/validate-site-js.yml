name: Validate site JavaScript

on:
  push:
    branches: ["main"]
    paths:
      - "app.js"
      - "operations-model.js"
      - "auth-session.js"
      - "site-content.js"
      - "firebase-config.js"
      - "login/**/*.js"
      - "signup/**/*.js"
      - "flight-information/**/*.js"
      - "book-your-journey/**/*.js"
      - "view-my-starmiles/**/*.js"
      - "admin/**/*.js"
      - "notices/**/*.js"
      - "translations.js"
      - "translations-extra.js"
      - ".github/workflows/validate-site-js.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --input-type=module --check < app.js
          node --input-type=module --check < operations-model.js
          node --input-type=module --check < auth-session.js
          node --input-type=module --check < site-content.js
          node --input-type=module --check < firebase-config.js
          node --input-type=module --check < translations.js
          node --input-type=module --check < translations-extra.js
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find login signup flight-information book-your-journey view-my-starmiles admin notices -type f -name '*.js' -print0)
