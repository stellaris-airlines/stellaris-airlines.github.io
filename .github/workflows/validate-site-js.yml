name: Validate site JavaScript

on:
  push:
    branches: ["main"]
    paths:
      - "app.js"
      - "operations-model.js"
      - "auth-session.js"
      - "site-content.js"
      - "digital-services.js"
      - "travel-service-core.js"
      - "firebase-config.js"
      - "login/**/*.js"
      - "signup/**/*.js"
      - "flight-information/**/*.js"
      - "book-your-journey/**/*.js"
      - "find-your-reservations/**/*.js"
      - "view-my-starmiles/**/*.js"
      - "admin/**/*.js"
      - "notices/**/*.js"
      - "check-in/**/*.js"
      - "boarding-pass/**/*.js"
      - "booking-confirmation/**/*.js"
      - "my-page/**/*.js"
      - "translations.js"
      - "translations-extra.js"
      - ".github/workflows/validate-site-js.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in app.js operations-model.js auth-session.js site-content.js digital-services.js travel-service-core.js firebase-config.js translations.js translations-extra.js; do
            node --input-type=module --check < "$file"
          done
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find login signup flight-information book-your-journey find-your-reservations view-my-starmiles admin notices check-in boarding-pass booking-confirmation my-page -type f -name '*.js' -print0)
      - name: Digital service smoke checks
        shell: bash
        run: |
          test -f check-in/index.html
          test -f boarding-pass/index.html
          test -f booking-confirmation/index.html
          test -f my-page/index.html
          grep -q "출발 예정 시각 24시간 전" check-in/index.html
          grep -q "data-operation-form" admin/index.html
          grep -q "data-notice-search" notices/index.html
          grep -q "digital-services.js" auth-session.js
