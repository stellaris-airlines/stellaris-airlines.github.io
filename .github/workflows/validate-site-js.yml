name: Validate site JavaScript

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.css"
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - ".github/workflows/validate-site-js.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

      - name: Check local script and stylesheet references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path('.').resolve()
          failures = []

          class Parser(HTMLParser):
              def __init__(self, html_path):
                  super().__init__()
                  self.html_path = html_path
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  refs = []
                  if tag == 'script' and attrs.get('src'):
                      refs.append(attrs['src'])
                  if tag == 'link' and attrs.get('href') and 'stylesheet' in attrs.get('rel','').lower():
                      refs.append(attrs['href'])
                  for raw in refs:
                      value = raw.strip()
                      if not value or value.startswith(('http://','https://','//','data:','blob:')):
                          continue
                      path = urlsplit(value).path
                      if not path:
                          continue
                      if path.startswith('/'):
                          target = root / path.lstrip('/')
                      else:
                          target = (self.html_path.parent / path).resolve()
                      try:
                          target.relative_to(root)
                      except ValueError:
                          failures.append(f'{self.html_path}: reference escapes repository: {value}')
                          continue
                      if not target.exists():
                          failures.append(f'{self.html_path}: missing local asset: {value} -> {target.relative_to(root)}')

          for html in root.rglob('*.html'):
              if '.git' in html.parts:
                  continue
              parser = Parser(html)
              parser.feed(html.read_text(encoding='utf-8'))

          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
          PY

      - name: Digital service smoke checks
        shell: bash
        run: |
          set -euo pipefail
          test -f check-in/index.html
          test -f boarding-pass/index.html
          test -f booking-confirmation/index.html
          test -f booking-complete/index.html
          test -f my-page/index.html
          test -f services/index.html
          test -f baggage/index.html
          test -f inflight-service/index.html
          test -f payments-refunds/index.html
          test -f special-assistance/index.html
          test -f travel-alerts/index.html
          test -f special-liveries/index.html
          test -f hotel-car/index.html
          test -f news/index.html
          test -f careers/index.html
          test -f careers/flight-operations/index.html
          test -f careers/cabin-airport-service/index.html
          test -f careers/engineering-maintenance/index.html
          test -f careers/digital-corporate/index.html
          test -f livery-gallery/index.html
          test -f international-passenger-conditions/index.html
          test -f international-cargo-conditions/index.html
          test -f legal-notices/index.html
          test -f auto-translate.js
          test -f site-navigation.js
          test -f site-v3.js
          test -f site-v3.css
          test -f home-popup.js
          test -f home-popup.css
          test -f gmail-inquiry-fix.js
          test -f legacy-popup-kill.js
          test -f storage.rules
          test -f admin/admin-bilingual.js
          test -f admin/admin-home-bilingual.js
          test -f admin/admin-popup.js
          test -f admin/admin-media.js
          test -f admin/rich-editor.js
          test -f book-your-journey/booking-stability.js

          grep -q "출발 예정 시각 24시간 전" check-in/index.html
          grep -q "data-operation-form" admin/index.html
          grep -q "admin-home-bilingual.js" admin/index.html
          grep -q "admin-bilingual.js" admin/index.html
          grep -q "data-notice-search" notices/index.html
          grep -q "notices.js" notices/index.html
          grep -q "digital-services.js" auth-session.js
          grep -q "auto-translate.js" auth-session.js
          grep -q "site-navigation.js" auth-session.js
          grep -q "auth-session.js" app.js
          grep -q "instagram.com/flystellaris" site-v3.js
          grep -q "api.open-meteo.com" site-v3.js
          grep -q "STELLARIS_BILINGUAL_V1" admin/admin-bilingual.js
          grep -q "STELLARIS_BILINGUAL_V1" notices/notices.js
          grep -q "STELLARIS_HOME_POPUP_V1" admin/admin-popup.js
          grep -q "STELLARIS_HOME_POPUP_V1" home-popup.js
          grep -q "home_popup_config" admin/admin-popup.js
          grep -q "home_popup_config" home-popup.js
          grep -q "mail.google.com" gmail-inquiry-fix.js
          grep -q "firebase.storage" storage.rules

      - name: Reject known bad runtime patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --exclude-dir=.git --exclude='*.md' "__home_popup__" .; then
            echo "Reserved Firestore document id __home_popup__ must not be used."
            exit 1
          fi
          if grep -R --line-number --exclude-dir=.git "new MutationObserver(cleanAdminList)" admin; then
            echo "Unthrottled admin cleanup observer detected."
            exit 1
          fi
          grep -q "__STELLARIS_APP_BOOTED__" app.js
          grep -q "requestAnimationFrame(refreshHeader)" auth-session.js
