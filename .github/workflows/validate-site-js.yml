name: Validate site JavaScript

on:
  push:
    branches: ["main"]
    paths:
      - "app.js"
      - "operations-model.js"
      - "auth-session.js"
      - "auto-translate.js"
      - "site-navigation.js"
      - "site-v3.js"
      - "site-v3.css"
      - "site-content.js"
      - "home-popup.js"
      - "home-popup.css"
      - "gmail-inquiry-fix.js"
      - "legacy-popup-kill.js"
      - "digital-services.js"
      - "travel-service-core.js"
      - "service-tools.js"
      - "site-experience-extension-v2.js"
      - "service-careers-i18n.js"
      - "legal-i18n.js"
      - "firebase-config.js"
      - "storage.rules"
      - "firebase.json"
      - "login/**/*.js"
      - "signup/**/*.js"
      - "flight-information/**/*.js"
      - "book-your-journey/**/*.js"
      - "booking-complete/**/*.js"
      - "find-your-reservations/**/*.js"
      - "view-my-starmiles/**/*.js"
      - "admin/**/*.js"
      - "admin/**/*.css"
      - "notices/**/*.js"
      - "notices/**/*.css"
      - "check-in/**/*.js"
      - "boarding-pass/**/*.js"
      - "booking-confirmation/**/*.js"
      - "my-page/**/*.js"
      - "careers/**/*.js"
      - "translations.js"
      - "translations-extra.js"
      - ".github/workflows/validate-site-js.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in app.js operations-model.js auth-session.js auto-translate.js site-navigation.js site-v3.js site-content.js home-popup.js gmail-inquiry-fix.js legacy-popup-kill.js digital-services.js travel-service-core.js service-tools.js site-experience-extension-v2.js service-careers-i18n.js legal-i18n.js firebase-config.js translations.js translations-extra.js; do
            node --input-type=module --check < "$file"
          done
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find login signup flight-information book-your-journey booking-complete find-your-reservations view-my-starmiles admin notices check-in boarding-pass booking-confirmation my-page careers -type f -name '*.js' -print0)
      - name: Digital service smoke checks
        shell: bash
        run: |
          test -f check-in/index.html
          test -f boarding-pass/index.html
          test -f booking-confirmation/index.html
          test -f booking-complete/index.html
          test -f my-page/index.html
          test -f services/index.html
          test -f baggage/index.html
          test -f inflight-service/index.html
          test -f payments-refunds/index.html
          test -f special-assistance/index.html
          test -f travel-alerts/index.html
          test -f special-liveries/index.html
          test -f hotel-car/index.html
          test -f news/index.html
          test -f careers/index.html
          test -f careers/flight-operations/index.html
          test -f careers/cabin-airport-service/index.html
          test -f careers/engineering-maintenance/index.html
          test -f careers/digital-corporate/index.html
          test -f livery-gallery/index.html
          test -f international-passenger-conditions/index.html
          test -f international-cargo-conditions/index.html
          test -f legal-notices/index.html
          test -f auto-translate.js
          test -f site-navigation.js
          test -f site-v3.js
          test -f site-v3.css
          test -f home-popup.js
          test -f home-popup.css
          test -f gmail-inquiry-fix.js
          test -f legacy-popup-kill.js
          test -f storage.rules
          test -f admin/admin-bilingual.js
          test -f admin/admin-home-bilingual.js
          test -f admin/admin-popup.js
          test -f admin/admin-media.js
          test -f admin/rich-editor.js
          test -f book-your-journey/booking-stability.js
          grep -q "출발 예정 시각 24시간 전" check-in/index.html
          grep -q "data-operation-form" admin/index.html
          grep -q "admin-home-bilingual.js?v=20260820-home-bilingual-v1" admin/index.html
          grep -q "admin-bilingual.js?v=20260820-bilingual-v3" admin/index.html
          grep -q "data-notice-search" notices/index.html
          grep -q "notices.js?v=20260820-notices-rich-v1" notices/index.html
          grep -q "digital-services.js" auth-session.js
          grep -q "auto-translate.js?v=20260820-auto-i18n-v3" auth-session.js
          grep -q "site-navigation.js?v=20260820-nav-v3" auth-session.js
          grep -q "auth-session.js?v=20260820-runtime-v3" app.js
          grep -q "instagram.com/flystellaris" site-v3.js
          grep -q "api.open-meteo.com" site-v3.js
          grep -q "STELLARIS_BILINGUAL_V1" admin/admin-bilingual.js
          grep -q "STELLARIS_BILINGUAL_V1" notices/notices.js
          grep -q "STELLARIS_HOME_POPUP_V1" admin/admin-popup.js
          grep -q "STELLARIS_HOME_POPUP_V1" home-popup.js
          grep -q "mail.google.com" gmail-inquiry-fix.js
          grep -q "firebase.storage" storage.rules
