<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#a89f52">
  <title>Stellaris Airlines</title>
  <link rel="icon" href="../assets/stellaris-symbol.png">
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="booking.css?v=20260816-fares-v4">
</head>
<body data-prefix="../" data-page="book-your-journey">
  <div id="siteHeader"></div>
  <main>
    <section class="page-hero compact-hero">
      <div class="shell">
        <div class="breadcrumbs"><a href="../">홈</a><span>/</span><span>항공권 예약</span></div>
        <div class="page-hero-grid">
          <div><p class="eyebrow">BOOK YOUR JOURNEY</p><h1>Where next?</h1></div>
          <p>제공된 정기 운항 스케줄에서 오늘부터 6개월 후까지의 여정을 예약하세요.</p>
        </div>
      </div>
    </section>

    <section class="content-section white booking-engine" data-i18n-skip>
      <div class="shell">
        <div class="booking-page-card">
          <div class="booking-tabs" role="tablist">
            <button class="tab-button active" type="button" data-booking-tab="round" role="tab" aria-selected="true">왕복</button>
            <button class="tab-button" type="button" data-booking-tab="oneway" role="tab" aria-selected="false">편도</button>
          </div>
          <form class="booking-form" id="bookingSearchForm">
            <div class="booking-route">
              <label><span data-label-origin>출발지</span><select id="fromInput" required></select></label>
              <button class="swap" id="swapButton" type="button" aria-label="출발지와 도착지 교환">⇄</button>
              <label><span data-label-destination>도착지</span><select id="toInput" required></select></label>
            </div>
            <div class="booking-details">
              <label><span data-label-departure>출발일</span><input id="departureDate" type="date" required></label>
              <label id="returnField"><span data-label-return>귀국일</span><input id="returnDate" type="date" required></label>
              <label><span data-label-passengers>탑승객</span><select id="passengerCount"><option value="1">성인 1명</option><option value="2">성인 2명</option><option value="3">성인 3명</option><option value="4">성인 4명</option></select></label>
              <label><span data-label-cabin>여행 클래스</span><select id="cabinClass"><option value="economy">Economy</option><option value="premium">Premium</option></select></label>
            </div>
            <button class="btn btn-olive wide" id="searchFlightsButton" type="submit">항공권 검색</button>
          </form>
          <div class="booking-meta"><p class="booking-window" data-booking-window></p><p data-fare-note>표시 운임은 성인 1인 편도 기준이며 세금과 유류할증료를 포함합니다.</p></div>
          <div class="booking-message" data-booking-message hidden></div>
        </div>

        <section class="flight-results" data-flight-results hidden>
          <div class="section-head">
            <div><p class="eyebrow">AVAILABLE FLIGHTS</p><h2 data-results-title>항공편과 운임 선택</h2></div>
            <p data-results-note>편명과 시각은 공개된 스텔라리스 정기 운항 스케줄을 사용합니다.</p>
          </div>
          <div data-outbound-results></div>
          <div data-return-results></div>
        </section>

        <section class="seat-selection" data-seat-selection hidden>
          <div class="seat-selection-head">
            <div><p class="eyebrow">SELECT YOUR SEAT</p><h2 data-seat-title>좌석 선택</h2><p data-seat-subtitle></p></div>
            <div class="seat-legend">
              <span><i class="seat-sample standard"></i><b data-seat-standard>일반 좌석</b></span>
              <span><i class="seat-sample front"></i><b data-seat-front>앞쪽 좌석</b></span>
              <span><i class="seat-sample extra"></i><b data-seat-extra>넓은 좌석</b></span>
              <span><i class="seat-sample occupied"></i><b data-seat-occupied>선택 불가</b></span>
              <span><i class="seat-sample selected"></i><b data-seat-selected>선택 좌석</b></span>
            </div>
          </div>
          <div class="seat-map-shell">
            <div class="aircraft-nose" aria-hidden="true"></div>
            <div class="seat-map" data-seat-map></div>
          </div>
          <div class="seat-fee-summary" data-seat-fee-summary></div>
        </section>

        <section class="booking-confirm" data-booking-confirm hidden>
          <div data-booking-summary></div>
          <button class="btn btn-dark" type="button" data-issue-ticket>선택한 여정 발권</button>
        </section>
      </div>
    </section>
  </main>
  <div id="siteFooter"></div>
  <script src="../app.js"></script>
  <script type="module" src="booking.js?v=20260816-fares-v4"></script>
</body>
</html>
