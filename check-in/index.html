<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#a89f52">
  <title>온라인 체크인 | Stellaris Airlines</title>
  <link rel="icon" href="../assets/stellaris-symbol.png">
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../service-pages.css?v=20260817-digital-v2">
</head>
<body data-prefix="../" data-page="check-in">
  <div id="siteHeader"></div>
  <main>
    <section class="page-hero compact-hero">
      <div class="shell">
        <div class="breadcrumbs"><a href="../">홈</a><span>/</span><span>온라인 체크인</span></div>
        <div class="page-hero-grid">
          <div><p class="eyebrow">ONLINE CHECK-IN</p><h1>Ready<br>to board.</h1></div>
          <p>출발 예정 시각 24시간 전부터 온라인 체크인이 가능합니다. 로그인된 계정의 예약을 자동으로 불러오며, 예약번호로 직접 찾을 수도 있습니다.</p>
        </div>
      </div>
    </section>
    <section class="content-section white">
      <div class="shell service-shell service-grid">
        <article class="service-card">
          <div class="service-card-head">
            <div><p class="eyebrow">FIND BOOKING</p><h2>예약번호로 체크인</h2></div>
          </div>
          <form class="service-form" data-checkin-lookup-form>
            <label>예약번호
              <input name="bookingRef" maxlength="8" autocomplete="off" placeholder="예: XS12ABCD" required>
            </label>
            <div class="service-actions">
              <button class="btn btn-dark" type="submit">예약 찾기</button>
              <a class="btn btn-dark" href="../find-your-reservations/">예약 조회</a>
            </div>
          </form>
        </article>
        <div data-checkin-message class="service-message">예약을 확인하고 있습니다…</div>
        <div data-checkin-list class="service-grid" hidden></div>
      </div>
    </section>
  </main>
  <div id="siteFooter"></div>
  <script src="../app.js?v=20260817-digital-v2"></script>
  <script type="module" src="check-in.js?v=20260817-digital-v2"></script>
</body>
</html>
