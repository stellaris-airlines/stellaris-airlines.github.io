<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>예약 조회 | Stellaris Airlines</title><link rel="icon" href="../assets/stellaris-symbol.png"><link href="https://fonts.googleapis.com/css2?family=Michroma&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../styles.css"></head><body data-prefix="../"><div id="siteHeader"></div><main><section class="page-hero compact-hero"><div class="shell"><div class="breadcrumbs"><a href="../">홈</a><span>/</span><span>예약 조회</span></div><div class="page-hero-grid"><div><p class="eyebrow">FIND YOUR RESERVATION</p><h1>My journey.</h1></div><p>로그인하거나 비회원으로 예약번호와 승객 정보를 입력해 국내선·국제선 예약을 조회할 수 있습니다.</p></div></div></section><section class="content-section white"><div class="shell reservation-shell"><div class="reservation-tabs"><button class="tab-button active" data-reservation-tab="guest">비회원 조회</button><button class="tab-button" data-reservation-tab="member">로그인 조회</button></div><section data-reservation-panel="guest"><div class="form-card"><h2>예약번호로 조회</h2><form class="demo-form"><label>예약번호 (Booking Reference)<input type="text" placeholder="예: XSABC12" required></label><label>승객 성 / Last name<input type="text" placeholder="예약 시 입력한 성" required></label><button class="btn btn-olive wide" type="submit">예약 조회</button></form><p class="form-help">여행사를 통해 예약한 항공권의 변경·취소·환불은 구매한 여행사에 문의해 주세요.</p></div></section><section data-reservation-panel="member" hidden><div class="form-card"><h2>Stellaris 계정으로 조회</h2><form class="demo-form"><label>이메일<input type="email" placeholder="name@example.com"></label><label>비밀번호<input type="password" placeholder="비밀번호"></label><button class="btn btn-dark wide" type="submit">로그인 후 예약 보기</button></form><p class="form-help">계정이 없으신가요? <a href="../login/#signup">회원가입</a></p></div></section><div class="reservation-info"><h3>예약에서 확인할 수 있는 정보</h3><div class="chip-list"><span>항공편·운항 상태</span><span>승객 정보</span><span>좌석 정보</span><span>수하물 정보</span><span>온라인 체크인</span><span>예약 변경 가능 항목</span></div><div class="status-grid" style="margin-top:25px"><span class="ok">● 정상 운항</span><span class="changed">● 시간 변경</span><span class="delay">● 지연</span><span class="cancel">● 취소</span><span class="boarding">● 탑승 준비</span></div></div></div></section></main><div id="siteFooter"></div><script src="../app.js"></script></body></html>
