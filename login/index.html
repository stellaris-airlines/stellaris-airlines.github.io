<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stellaris Airlines</title>
  <link rel="icon" href="../assets/stellaris-symbol.png">
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body data-prefix="../" data-page="login">
  <div id="siteHeader"></div>
  <main class="auth-shell">
    <section class="auth-single">
      <p class="eyebrow">STELLARIS ACCOUNT</p>
      <h1>로그인</h1>
      <p class="auth-intro">계정으로 예약과 Star Miles를 한곳에서 관리하세요.</p>

      <div id="loginArea">
        <button id="googleLoginButton" class="auth-provider-button" type="button">
          <span class="google-mark" aria-hidden="true">G</span>
          <span>Google로 계속하기</span>
        </button>

        <div class="auth-divider"><span>또는</span></div>

        <form id="loginForm" novalidate>
          <label>이메일
            <input id="loginEmail" name="email" type="email" placeholder="이메일" autocomplete="email" required>
          </label>
          <label>비밀번호
            <input id="loginPassword" name="password" type="password" placeholder="비밀번호" autocomplete="current-password" required>
          </label>
          <button id="loginSubmit" class="btn btn-olive wide" type="submit">로그인</button>
          <button id="resetPasswordButton" class="auth-reset-button" type="button">비밀번호를 잊으셨나요?</button>
        </form>
      </div>

      <p id="loginMessage" class="auth-message" role="status" aria-live="polite" hidden></p>

      <div id="signedInPanel" class="auth-user-panel" hidden>
        <p data-auth-label>현재 로그인된 계정</p>
        <strong id="signedInEmail"></strong>
        <div class="auth-user-actions">
          <a class="btn btn-olive" href="../">홈으로 이동</a>
          <button id="logoutButton" class="btn btn-dark" type="button">로그아웃</button>
        </div>
      </div>

      <div class="auth-alt">
        <a href="../find-your-reservations/">비회원 예약 조회</a>
        <span>아직 계정이 없으신가요? <a href="../signup/">회원가입</a></span>
      </div>
    </section>
  </main>
  <div id="siteFooter"></div>
  <script src="../app.js?v=20260816-auth"></script>
  <script type="module" src="login-auth.js?v=20260816-auth"></script>
</body>
</html>
