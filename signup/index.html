<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stellaris Airlines</title>
  <link rel="icon" href="../assets/stellaris-symbol.png">
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../login/auth.css">
</head>
<body data-prefix="../" data-page="signup">
  <div id="siteHeader"></div>
  <main class="auth-shell">
    <section class="auth-single">
      <p class="eyebrow">CREATE ACCOUNT</p>
      <h1>회원가입</h1>
      <p class="auth-intro">Stellaris 계정을 만들고 예약과 Star Miles를 한곳에서 관리하세요.</p>

      <div id="signupArea">
        <button id="googleSignupButton" class="auth-provider-button" type="button">
          <span class="google-mark" aria-hidden="true">G</span>
          <span>Google로 계속하기</span>
        </button>

        <div class="auth-divider"><span>또는</span></div>

        <form id="signupForm" novalidate>
          <label>이름
            <input id="signupName" name="name" type="text" placeholder="이름" autocomplete="name" maxlength="50" required>
          </label>
          <label>이메일
            <input id="signupEmail" name="email" type="email" placeholder="이메일" autocomplete="email" required>
          </label>
          <label>비밀번호
            <input id="signupPassword" name="password" type="password" placeholder="비밀번호" autocomplete="new-password" minlength="6" required>
          </label>
          <label>비밀번호 확인
            <input id="signupPasswordConfirm" name="passwordConfirm" type="password" placeholder="비밀번호 확인" autocomplete="new-password" minlength="6" required>
          </label>
          <p class="auth-help">비밀번호는 6자 이상 입력해 주세요.</p>
          <button id="signupSubmit" class="btn btn-olive wide" type="submit">계정 만들기</button>
        </form>
      </div>

      <p id="signupMessage" class="auth-message" role="status" aria-live="polite" hidden></p>

      <div id="signupSignedInPanel" class="auth-user-panel" hidden>
        <p data-auth-label>현재 로그인된 계정</p>
        <strong id="signupSignedInEmail"></strong>
        <div class="auth-user-actions">
          <a class="btn btn-olive" href="../">홈으로 이동</a>
          <button id="signupLogoutButton" class="btn btn-dark" type="button">로그아웃</button>
        </div>
      </div>

      <div class="auth-alt">
        <span>이미 계정이 있으신가요? <a href="../login/">로그인</a></span>
        <a href="../find-your-reservations/">비회원 예약 조회</a>
      </div>
    </section>
  </main>
  <div id="siteFooter"></div>
  <script src="../app.js?v=20260816-auth"></script>
  <script type="module" src="signup-auth.js?v=20260816-auth"></script>
</body>
</html>
